name: Daily Valuation Update

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei

      - name: Run main script
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}   # ← 新增
        run: python main.py

      - name: Upload backup artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
